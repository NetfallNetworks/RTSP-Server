[versions]
#plugins versions
agp = "8.13.2"
kotlin = "2.3.20"
dokka = "2.1.0"

#dependencies versions
#noinspection GradleDependency, version 1.7.0 need min sdk 21
appcompat = "1.6.1"
#noinspection GradleDependency, version 2.2.0 need min sdk 21
constraintlayout = "2.1.4"
coroutines = "1.10.2"
ktor = "3.4.1"
rootEncoder = "2.7.2"
# Fork of pedroSG94/RootEncoder at NetfallNetworks/RootEncoder. netfall/2.7.2 is upstream
# 2.7.2 plus prepareVideoCropped() (decouples camera capture size from encoder output size
# so a 4:3-native sensor can still produce genuine, undistorted output at a size of its own
# choosing) and turns video stabilization off unless asked for (some HALs default it on,
# cropping the field of view). This pin, 165122d, is the head of branch
# fix/rtsp-stapa-start-codes (off netfall/2.7.2, RootEncoder#2), which additionally strips
# SPS/PPS start codes from STAP-A. JitPack builds any commit SHA of a public fork directly
# -- this pins to that branch's head.
rootEncoderFork = "05ed5aca56def2dde53a5f8bdfa3bfd09b712d59"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
rootEncoder-library = { module = "com.github.NetfallNetworks.RootEncoder:library", version.ref = "rootEncoderFork" }
rootEncoder-extra-sources = { module = "com.github.pedroSG94.RootEncoder:extra-sources", version.ref = "rootEncoder" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }